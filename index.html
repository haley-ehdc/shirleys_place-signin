<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Everyone Home DC — Check In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a3a5c; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .logo-wrap { margin-bottom: 1.5rem; text-align: center; }
  .logo-wrap img { height: 100px; width: auto; }
  .card { background: #fff; border-radius: 16px; padding: 2rem 2.5rem; width: 100%; max-width: 520px; }
  h1 { font-size: 22px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; text-align: center; }
  .sub { font-size: 15px; color: #666; text-align: center; margin-bottom: 1.75rem; }
  .field { margin-bottom: 1.25rem; position: relative; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  input[type="text"], input[type="date"], select {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #ccc; font-size: 16px; background: #fff;
    color: #1a1a1a; font-family: inherit; appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: #1a3a5c; box-shadow: 0 0 0 3px rgba(26,58,92,0.12); }
  .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-radius: 10px; z-index: 10; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .autocomplete-item { padding: 12px 14px; font-size: 15px; cursor: pointer; color: #1a1a1a; border-bottom: 1px solid #f0f0f0; }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: #f0f5fb; }
  .confirm-box { background: #e8f0f8; border: 1px solid #b0c8e8; border-radius: 10px; padding: 14px 16px; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .confirm-box p { font-size: 14px; color: #1a3a5c; flex: 1; }
  .confirm-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-yes { padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; background: #1a3a5c; color: #fff; border: none; }
  .btn-no { padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; background: #fff; color: #1a3a5c; border: 1px solid #1a3a5c; }
  .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .svc-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; font-size: 15px; cursor: pointer; font-family: inherit; transition: all 0.15s; text-align: left; }
  .svc-btn svg { flex-shrink: 0; opacity: 0.5; }
  .svc-btn.on { background: #e8f0f8; border-color: #1a3a5c; color: #1a3a5c; }
  .svc-btn.on svg { opacity: 1; stroke: #1a3a5c; }
  .svc-hint { font-size: 13px; color: #666; margin-top: 8px; min-height: 18px; }
  .main-btn { width: 100%; padding: 14px; border-radius: 10px; background: #1a3a5c; color: #fff; border: none; font-size: 17px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 0.75rem; transition: opacity 0.15s; }
  .main-btn:hover { opacity: 0.88; }
  .main-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 1.5rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; transition: background 0.2s; }
  .dot.on { background: #1a3a5c; }
  .success-wrap { text-align: center; padding: 1.5rem 0; }
  .success-icon { width: 72px; height: 72px; border-radius: 50%; background: #d4edda; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
  .success-icon svg { stroke: #28a745; }
  .success-wrap h2 { font-size: 24px; font-weight: 500; margin-bottom: 10px; color: #1a1a1a; }
  .success-wrap p { color: #555; font-size: 16px; margin-bottom: 2rem; line-height: 1.6; }
  .restart-btn { padding: 12px 32px; border-radius: 10px; border: 1px solid #ccc; background: #f5f5f5; color: #1a1a1a; font-size: 15px; cursor: pointer; font-family: inherit; }
  .err { font-size: 13px; color: #c0392b; margin-top: 8px; }
  @media (max-width: 480px) {
    .card { padding: 1.5rem 1.25rem; }
    .services-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="logo-wrap">
  <img src="https://everyonehomedc.org/wp-content/uploads/2019/03/ehdc-logo.png" alt="Everyone Home DC" style="height:110px;width:auto;">
</div>

<div class="card" id="main-card">
  <div class="dots">
    <div class="dot on" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
    <div class="dot" id="d4"></div>
  </div>

  <div id="step-1">
    <h1>Welcome</h1>
    <p class="sub">Start typing your name to check in</p>
    <div class="field">
      <label for="fname">First name</label>
      <input type="text" id="fname" placeholder="First name" autocomplete="off" oninput="onNameInput()">
      <div class="autocomplete-list" id="ac-list" style="display:none"></div>
    </div>
    <div class="field">
      <label for="lname">Last name</label>
      <input type="text" id="lname" placeholder="Last name" autocomplete="off" oninput="onNameInput()">
    </div>
    <div id="confirm-box" style="display:none" class="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-btns">
        <button class="btn-yes" onclick="confirmReturning()">Yes, that's me</button>
        <button class="btn-no" onclick="dismissConfirm()">No</button>
      </div>
    </div>
    <button class="main-btn" onclick="goStep(2)">Continue</button>
  </div>

  <div id="step-2" style="display:none">
    <h1>Date of birth</h1>
    <p class="sub">Please confirm your date of birth</p>
    <div class="field">
      <label for="dob">Date of birth</label>
      <input type="date" id="dob" max="">
    </div>
    <button class="main-btn" onclick="goStep(3)">Continue</button>
  </div>

  <div id="step-3" style="display:none">
    <h1>Housing situation</h1>
    <p class="sub">What best describes where you are staying?</p>
    <div class="field">
      <label for="housing">Current housing situation</label>
      <select id="housing">
        <option value="" disabled selected>Select an option</option>
        <option>Sleeping rough / outdoors</option>
        <option>Staying in a shelter</option>
        <option>Staying with friends or family</option>
        <option>Temporary or transitional housing</option>
        <option>Stable housing</option>
        <option>Prefer not to say</option>
      </select>
    </div>
    <button class="main-btn" onclick="goStep(4)">Continue</button>
  </div>

  <div id="step-4" style="display:none">
    <h1>Services needed</h1>
    <p class="sub">What do you need today? Select all that apply.</p>
    <div class="field">
      <div class="services-grid">
        <button class="svc-btn" onclick="toggleSvc(this,'Food')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7c0-1.4 1.1-2.5 2.5-2.5S7 5.6 7 7v10H2V7zM7 12h5M7 7c0-1.4 1.1-2.5 2.5-2.5S12 5.6 12 7v10H7"/><path d="M16 3c0 0 4 2 4 9H16V3z"/><line x1="16" y1="12" x2="20" y2="12"/></svg>
          Food
        </button>
        <button class="svc-btn" onclick="toggleSvc(this,'Shower')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 12a8 8 0 0 1 16 0"/><line x1="8" y1="16" x2="8" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="16" y1="16" x2="16" y2="20"/></svg>
          Shower
        </button>
        <button class="svc-btn" onclick="toggleSvc(this,'Laundry')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><line x1="8" y1="7" x2="8" y2="7"/><line x1="12" y1="7" x2="14" y2="7"/></svg>
          Laundry
        </button>
        <button class="svc-btn" onclick="toggleSvc(this,'Clothing')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>
          Clothing
        </button>
        <button class="svc-btn" onclick="toggleSvc(this,'Toiletries')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2h4l2 4H3V2z"/><rect x="3" y="6" width="6" height="14" rx="1"/><path d="M15 2s2 1.5 2 5-2 5-2 5V2z"/><rect x="13" y="12" width="6" height="8" rx="1"/></svg>
          Toiletries
        </button>
        <button class="svc-btn" onclick="toggleSvc(this,'Other')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          Other
        </button>
      </div>
      <div class="svc-hint" id="svc-hint"></div>
    </div>
    <button class="main-btn" id="submit-btn" onclick="submitForm()" disabled>Check in</button>
    <div class="err" id="submit-err"></div>
  </div>
</div>

<div class="card" id="success-card" style="display:none">
  <div class="success-wrap">
    <div class="success-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2 id="success-name">Checked in!</h2>
    <p id="success-svcs">A team member will be with you shortly.</p>
    <button class="restart-btn" onclick="restart()">New check-in</button>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxOTUFkUIkISCUlmlJn-h1pS3QtHwhF1rUWKjLb5XB6HVy14VN6_PKbYfOlUpZyU0/exec';
let knownClients = [];
let selectedSvcs = [];
let currentStep = 1;
let returningClient = null;

document.getElementById('dob').max = new Date().toISOString().split('T')[0];

async function loadNames() {
  try {
    const r = await fetch(SCRIPT_URL);
    const d = await r.json();
    knownClients = d.names || [];
  } catch(e) {}
}
loadNames();

function onNameInput() {
  const fn = document.getElementById('fname').value.trim().toLowerCase();
  const ln = document.getElementById('lname').value.trim().toLowerCase();
  const acList = document.getElementById('ac-list');
  const confirmBox = document.getElementById('confirm-box');
  if (fn.length < 2) { acList.style.display='none'; confirmBox.style.display='none'; returningClient=null; return; }
  const matches = knownClients.filter(c =>
    c.firstName && c.firstName.toLowerCase().startsWith(fn) &&
    (!ln || (c.lastName && c.lastName.toLowerCase().startsWith(ln)))
  );
  if (matches.length > 0 && !ln) {
    acList.innerHTML = matches.slice(0,6).map(c =>
      `<div class="autocomplete-item" onclick="selectClient('${c.firstName}','${c.lastName}','${c.dob}')">${c.firstName} ${c.lastName}</div>`
    ).join('');
    acList.style.display = 'block';
  } else {
    acList.style.display = 'none';
  }
  if (fn && ln) {
    const exact = knownClients.find(c =>
      c.firstName && c.lastName &&
      c.firstName.toLowerCase() === fn &&
      c.lastName.toLowerCase() === ln
    );
    if (exact) {
      returningClient = exact;
      document.getElementById('confirm-text').textContent = 'Welcome back, ' + exact.firstName + ' ' + exact.lastName + '! Is that you?';
      confirmBox.style.display = 'flex';
    } else {
      confirmBox.style.display = 'none';
      returningClient = null;
    }
  }
}

function selectClient(fn, ln, dob) {
  document.getElementById('fname').value = fn;
  document.getElementById('lname').value = ln;
  document.getElementById('ac-list').style.display = 'none';
  returningClient = {firstName: fn, lastName: ln, dob: dob};
  document.getElementById('confirm-text').textContent = 'Welcome back, ' + fn + ' ' + ln + '! Is that you?';
  document.getElementById('confirm-box').style.display = 'flex';
}

function confirmReturning() {
  if (returningClient && returningClient.dob) {
    document.getElementById('dob').value = returningClient.dob;
  }
  document.getElementById('confirm-box').style.display = 'none';
}

function dismissConfirm() {
  returningClient = null;
  document.getElementById('confirm-box').style.display = 'none';
  document.getElementById('fname').value = '';
  document.getElementById('lname').value = '';
  document.getElementById('dob').value = '';
}

function goStep(n) {
  if (n===2 && !document.getElementById('fname').value.trim()) { document.getElementById('fname').focus(); return; }
  if (n===2 && !document.getElementById('lname').value.trim()) { document.getElementById('lname').focus(); return; }
  if (n===3 && !document.getElementById('dob').value) { document.getElementById('dob').focus(); return; }
  if (n===4 && !document.getElementById('housing').value) { document.getElementById('housing').focus(); return; }
  document.getElementById('step-'+currentStep).style.display='none';
  document.getElementById('d'+currentStep).classList.remove('on');
  currentStep = n;
  document.getElementById('step-'+n).style.display='block';
  document.getElementById('d'+n).classList.add('on');
}

function toggleSvc(btn, svc) {
  if (btn.classList.contains('on')) {
    btn.classList.remove('on');
    selectedSvcs = selectedSvcs.filter(s => s!==svc);
  } else {
    btn.classList.add('on');
    selectedSvcs.push(svc);
  }
  document.getElementById('svc-hint').textContent = selectedSvcs.length ? 'Selected: '+selectedSvcs.join(', ') : '';
  document.getElementById('submit-btn').disabled = selectedSvcs.length===0;
}

async function submitForm() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  document.getElementById('submit-err').textContent = '';
  const payload = {
    firstName: document.getElementById('fname').value.trim(),
    lastName: document.getElementById('lname').value.trim(),
    dob: document.getElementById('dob').value,
    housing: document.getElementById('housing').value,
    services: selectedSvcs.join(', ')
  };
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    document.getElementById('main-card').style.display='none';
    document.getElementById('success-card').style.display='block';
    document.getElementById('success-name').textContent = 'Thanks, '+payload.firstName+'!';
    document.getElementById('success-svcs').textContent = 'Checked in for: '+payload.services+'. A team member will be with you shortly.';
    knownClients.push({firstName:payload.firstName, lastName:payload.lastName, dob:payload.dob});
  } catch(e) {
    document.getElementById('submit-err').textContent = 'Could not save. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Check in';
  }
}

function restart() {
  document.getElementById('fname').value='';
  document.getElementById('lname').value='';
  document.getElementById('dob').value='';
  document.getElementById('housing').value='';
  document.getElementById('ac-list').style.display='none';
  document.getElementById('confirm-box').style.display='none';
  selectedSvcs=[];
  returningClient=null;
  document.querySelectorAll('.svc-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('svc-hint').textContent='';
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').textContent='Check in';
  document.getElementById('d'+currentStep).classList.remove('on');
  currentStep=1;
  document.getElementById('d1').classList.add('on');
  document.getElementById('step-4').style.display='none';
  document.getElementById('step-1').style.display='block';
  document.getElementById('success-card').style.display='none';
  document.getElementById('main-card').style.display='block';
}
</script>
</body>
</html>
